name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches package.json
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Extract changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## {re.escape(version)}\b[^\n]*\n", text, re.M)
          if match:
              start = match.end()
              nxt = re.search(r"^## ", text[start:], re.M)
              notes = text[start:start + nxt.start() if nxt else None].strip()
          else:
              notes = ""
          if not notes:
              notes = f"Source release {version}."
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "FlowPeek v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "flowpeek-${VERSION}.tgz"
